# NOTE (2026-08-09, PR 0 of the tenant-architecture build): this file has
# drifted from the live Render services and is NOT under active Blueprint
# auto-sync — confirmed via the Render API: the live redis service is named
# "nce-redis" (not "permit-ai-redis" below), the live web service's plan is
# "pro" (not "standard"), and its startCommand is "cd backend && uvicorn
# main:app ..." (not "uvicorn backend.main:app ..."). Editing this file alone
# does not provision or change anything live — treat it as documentation of
# intent, and make any real infra change directly (Render dashboard or API),
# then update this file to match, not the other way around.
databases:
  - name: nce-tenant-db
    databaseName: nce_tenant_db
    plan: basic_256mb
    region: frankfurt
    postgresMajorVersion: "16"
    # Provisioned directly via the Render API on 2026-08-09 (id
    # dpg-d9s78sv40ujc73co6550-a) — real company/user data (PII), so NOT the
    # free tier (which expires). Scoped narrowly per the tenant-architecture
    # design report: this is a SEPARATE database from ChromaDB and every
    # existing SQLite file (retrieval_trace.db, raqs_reviews.db, payments.db)
    # — none of that moves here. RLS policies land in PR B, once real tables
    # exist (PR A). Empty baseline Alembic migration applied and verified
    # (upgrade/downgrade round-trip) against the live database in PR 0.

services:
  - type: redis
    name: permit-ai-redis
    plan: starter        # 256 MB persistent — free tier has no persistence and too few connections
    maxmemoryPolicy: noeviction  # never evict job entries from the task queue

  - type: web
    name: nce-energy-permit-ai
    runtime: python
    plan: standard
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: permit-ai-data
      mountPath: /opt/render/project/src/permit_ai/embeddings
      sizeGB: 5
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ENTSOE_API_TOKEN
        sync: false  # ENTSO-E Transparency Platform RESTful API security token —
                     # see permit_ai/entsoe_prices.py. Registration is two-step:
                     # self-service account at transparency.entsoe.eu, THEN a
                     # manual email to transparency@entsoe.eu ("Restful API
                     # access" in the subject) before a token can be generated —
                     # not instant self-service like the other keys here.
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: SENTENCE_TRANSFORMERS_HOME
        value: /opt/render/project/src/.model_cache
      - key: REDIS_URL
        fromService:
          type: redis
          name: permit-ai-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: nce-tenant-db
          property: connectionString
        # NOT YET set on the live web service as of 2026-08-09 — that write
        # was blocked by the permission classifier (a mutation to production
        # service env vars) and needs explicit human action: either the user
        # sets it via the Render dashboard, or explicitly authorizes the API
        # call. Internal connection string (same pattern as REDIS_URL above),
        # since this file isn't under active Blueprint sync — see the note
        # at the top of this file.
    healthCheckPath: /api/health
    # NOTE: ARQ worker runs in-process (see _arq_startup in main.py).
    # A separate type:worker service is blocked until ChromaDB moves to server
    # mode — the persistent disk (permit-ai-data) can only mount on one service.
