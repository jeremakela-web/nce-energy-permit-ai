# NOTE (2026-08-09, PR 0 of the tenant-architecture build): this file has
# drifted from the live Render services and is NOT under active Blueprint
# auto-sync — confirmed via the Render API: the live redis service is named
# "nce-redis" (not "permit-ai-redis" below), the live web service's plan is
# "pro" (not "standard"), and its startCommand is "cd backend && uvicorn
# main:app ..." (not "uvicorn backend.main:app ..."). Editing this file alone
# does not provision or change anything live — treat it as documentation of
# intent, and make any real infra change directly (Render dashboard or API),
# then update this file to match, not the other way around.
databases:
  - name: nce-tenant-db
    databaseName: nce_tenant_db
    plan: basic_256mb
    region: frankfurt
    postgresMajorVersion: "16"
    # Provisioned directly via the Render API on 2026-08-09 (id
    # dpg-d9s78sv40ujc73co6550-a) — real company/user data (PII), so NOT the
    # free tier (which expires). Scoped narrowly per the tenant-architecture
    # design report: this is a SEPARATE database from ChromaDB and every
    # existing SQLite file (retrieval_trace.db, raqs_reviews.db, payments.db)
    # — none of that moves here. RLS policies land in PR B, once real tables
    # exist (PR A). Empty baseline Alembic migration applied and verified
    # (upgrade/downgrade round-trip) against the live database in PR 0.

services:
  - type: redis
    name: permit-ai-redis
    plan: starter        # 256 MB persistent — free tier has no persistence and too few connections
    maxmemoryPolicy: noeviction  # never evict job entries from the task queue

  - type: web
    name: nce-energy-permit-ai
    runtime: python
    plan: standard
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    previews:
      generation: "off"  # 2026-08-23: PR previews were auto-inheriting this
        # service's REDIS_URL (fromService binding below), instead of an
        # isolated instance. A stale, 10-day-old PR #77 preview
        # (srv-d9uo7frbc2fs739k3p00) was found running its own independent
        # in-process arq worker against PRODUCTION's Redis queue,
        # uncoordinated with production's worker -- both racing to claim
        # the same generation jobs. When the stale preview won the race, it
        # ran outdated code that failed immediately, silently "losing" the
        # job from production's point of view (client sees status=pending
        # forever, no error, since production's own process never touched
        # it). This was the root cause of a ~50-58% real-world hit-rate
        # failure on /api/generate-application, confirmed via direct log
        # evidence on the stale preview's own service, not inferred.
        # Disabled here as documentation ONLY -- per this file's own
        # "not under active Blueprint auto-sync" note above, the field that
        # actually matters is the live service's own `previews.generation`
        # setting, changed directly via the Render API. Re-enabling PR
        # previews (e.g. for future frontend/UI work) requires first
        # verifying a fresh preview gets a genuinely isolated Redis
        # instance, not just flipping this back on.
    disk:
      name: permit-ai-data
      mountPath: /opt/render/project/src/permit_ai/embeddings
      sizeGB: 5
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ENTSOE_API_TOKEN
        sync: false  # ENTSO-E Transparency Platform RESTful API security token —
                     # see permit_ai/entsoe_prices.py. Registration is two-step:
                     # self-service account at transparency.entsoe.eu, THEN a
                     # manual email to transparency@entsoe.eu ("Restful API
                     # access" in the subject) before a token can be generated —
                     # not instant self-service like the other keys here.
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: SENTENCE_TRANSFORMERS_HOME
        value: /opt/render/project/src/.model_cache
      - key: REDIS_URL
        fromService:
          type: redis
          name: permit-ai-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: nce-tenant-db
          property: connectionString
        # Confirmed set and live on the web service as of 2026-08-09 (PR 0) —
        # required an explicit redeploy after setting it; a plain /restart
        # does not pick up new env vars, only a fresh build does. Internal
        # connection string (same pattern as REDIS_URL above), set via the
        # Render API directly since this file isn't under active Blueprint
        # sync — see the note at the top of this file.
      - key: SESSION_SECRET_KEY
        sync: false
        # PR A — signs the magic-link-auth session cookie (starlette
        # SessionMiddleware). Confirmed set and live as of 2026-08-09 —
        # verified via the running process, not just the dashboard (same
        # redeploy-required lesson as DATABASE_URL above).
      - key: TENANT_SCOPED_DATABASE_URL
        sync: false
        # PR B — the RLS-restricted connection (role nce_app_scoped, NOT
        # the table owner nce_tenant_db_user that DATABASE_URL above
        # points to) used for Layer 1 tenant-scoped queries (projects/
        # reports/rag_queries). Cannot be expressed as fromDatabase like
        # DATABASE_URL — Render's database resource only exposes a
        # connection string for its one provisioned owner user; this role
        # was created by hand via SQL (see the PR B migration's docstring)
        # specifically so RLS actually restricts it (Postgres RLS never
        # restricts a table's owning role by default). NOT YET set on the
        # live web service as of PR B being written — same as
        # DATABASE_URL/SESSION_SECRET_KEY before them, needs an explicit
        # human action (dashboard, or authorize the API call) plus a
        # redeploy, not just a restart.
      - key: TENANT_TRACKING_ENABLED
        value: "false"
        # PR B — gates whether the 3 tenant-tracking call sites in
        # backend/main.py (see backend/tenant_db/layer1.py) do anything at
        # all. Defaults false/off: the existing Basic-Auth-gated generation
        # flow is completely unaffected either way, and no real tenant-
        # authenticated traffic reaches these routes yet regardless of this
        # flag's value (PR A's magic-link session system doesn't gate them
        # — a future PR decides if/when it does). Flip to "true" only once
        # TENANT_SCOPED_DATABASE_URL above is actually set.
    healthCheckPath: /api/health
    # NOTE: ARQ worker runs in-process (see _arq_startup in main.py).
    # A separate type:worker service is blocked until ChromaDB moves to server
    # mode — the persistent disk (permit-ai-data) can only mount on one service.
